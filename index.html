    <meta charset="UTF-8" />

    <title>THEODOR — Think outside the box, mate!</title>
    <meta name="description" content="A music theory companion for guitar, bass and piano: identify chords and scales, build songs, analyse keys and progressions, and find jazzy new ideas." />
    <meta name="theme-color" content="#0a0b10" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="THEODOR — Think outside the box, mate!" />
    <meta property="og:description" content="Name any chord or scale, take songs apart and break out of the pentatonic box. Free music theory workbench for guitar &amp; bass." />

    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint (no flash)
      try {
        var s = JSON.parse(localStorage.getItem('theodor.settings.v1') || '{}');
        var t = s.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
