<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>THEODOR — Think outside the box, mate!</title>
    <meta name="description" content="A music theory companion for guitar, bass and piano: identify chords and scales, build songs, analyse keys and progressions, and find jazzy new ideas." />
    <meta name="theme-color" content="#0a0b10" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint (no flash)
      try {
        var s = JSON.parse(localStorage.getItem('theodor.settings.v1') || '{}');
        var t = s.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
