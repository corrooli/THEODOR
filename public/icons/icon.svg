<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="160" y1="400" x2="420" y2="110">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".5" stop-color="#ff5e7e"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <radialGradient id="bg" cx=".3" cy=".25" r="1">
      <stop offset="0" stop-color="#2a2140"/>
      <stop offset=".55" stop-color="#14121f"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5e7e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5e7e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9b6bff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="box"><rect x="104" y="128" width="280" height="280" rx="44"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <!-- glow behind the escaping note -->
  <circle cx="230" cy="330" r="190" fill="url(#glow)"/>
  <circle cx="400" cy="112" r="110" fill="url(#glow2)"/>
  <!-- the box: a fretboard window with strings and frets -->
  <g clip-path="url(#box)" opacity=".5">
    <g stroke="#fff" stroke-opacity=".16" stroke-width="3">
      <path d="M104 175h280M104 222h280M104 269h280M104 316h280M104 363h280"/>
    </g>
    <g stroke="#fff" stroke-opacity=".10" stroke-width="6">
      <path d="M197 128v280M290 128v280"/>
    </g>
  </g>
  <path d="M300 128H148a44 44 0 0 0-44 44v192a44 44 0 0 0 44 44h192a44 44 0 0 0 44-44V212"
        fill="none" stroke="#fff" stroke-opacity=".82" stroke-width="22" stroke-linecap="round"/>
  <!-- the note breaking out through the open corner -->
  <g filter="url(#shadow)">
  <path d="M244 352V176l166-48" fill="none" stroke="url(#brand)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="200" cy="352" rx="54" ry="46" transform="rotate(-18 200 352)" fill="url(#brand)"/>
  </g>
  <!-- trail of notes flying out -->
  <circle cx="420" cy="94" r="22" fill="#9b6bff"/>
  <circle cx="452" cy="58" r="12" fill="#c4a8ff" fill-opacity=".85"/>
  <circle cx="470" cy="128" r="7" fill="#ff8fa6" fill-opacity=".8"/>
</svg>
